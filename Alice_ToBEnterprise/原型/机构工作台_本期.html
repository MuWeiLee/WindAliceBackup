          if(!slot||!target||!assignableMembers().some(item=>item.id===target.id))return toast("该成员已有付费席位或不可分配");
          if(replacing?!slot.memberId:!!slot.memberId)return toast("席位分配已变更");
          slot.memberId=target.id;save();closeModal();render();toast(replacing?"使用人已更换":"席位已分配");
        };
      }
      function updateDialogActive(scroll=false){
        const input=$("#dialogUserSearch"),items=[...document.querySelectorAll("#dialogUserOptions [role=option]")];
        if(!input||!ui.dialogPickerOpen)return;
        if(!items.length){input.removeAttribute("aria-activedescendant");return}
        ui.dialogActiveIndex=Math.max(0,Math.min(ui.dialogActiveIndex,items.length-1));
        items.forEach((item,index)=>item.classList.toggle("active",index===ui.dialogActiveIndex));
        input.setAttribute("aria-activedescendant",items[ui.dialogActiveIndex].id);
        if(scroll)items[ui.dialogActiveIndex].scrollIntoView({block:"nearest"});
      }
      function openDialogPicker(){
        const input=$("#dialogUserSearch"),list=$("#dialogUserOptions");
        if(!input||!list)return;
        ui.dialogPickerOpen=true;list.hidden=false;input.setAttribute("aria-expanded","true");
        if(ui.dialogUser&&!ui.dialogQuery)input.value="";
        updateDialogActive();
      }
      function closeDialogPicker(){
        const input=$("#dialogUserSearch"),list=$("#dialogUserOptions");
        ui.dialogPickerOpen=false;
        if(!input||!list)return;
        list.hidden=true;input.setAttribute("aria-expanded","false");input.removeAttribute("aria-activedescendant");
        const target=member(ui.dialogUser);
        input.value=target?target.name+" · "+target.phone:ui.dialogQuery;
      }
      function chooseDialogUser(id){
        if(!member(id))return;
        ui.dialogUser=id;ui.dialogQuery="";ui.dialogPickerOpen=false;ui.dialogActiveIndex=0;
        renderDialogues();
        $("#dialogUserSearch").focus();closeDialogPicker();
      }
      function dialogTimeRange(){
        if(ui.dialogPeriod==="custom"){
          if(!ui.dialogStart||!ui.dialogEnd)return {valid:false,message:"请选择开始日期和结束日期"};
          if(ui.dialogStart>ui.dialogEnd)return {valid:false,message:"开始日期不能晚于结束日期"};
          return {valid:true,match:item=>item.at.slice(0,10)>=ui.dialogStart&&item.at.slice(0,10)<=ui.dialogEnd};
        }
        const now=new Date(),start=new Date(now);
        if(ui.dialogPeriod==="1d")start.setDate(start.getDate()-1);
        else if(ui.dialogPeriod==="1m"){
          const day=start.getDate();
          start.setDate(1);
          start.setMonth(start.getMonth()-1);
          start.setDate(Math.min(day,new Date(start.getFullYear(),start.getMonth()+1,0).getDate()));
        }
        else start.setDate(start.getDate()-7);
        return {valid:true,match:item=>{const time=new Date(item.at.replace(" ","T"));return time>=start&&time<=now}};
      }
      function renderDialogues(){
        const query=ui.dialogQuery.trim().toLowerCase();
        const candidates=data.members.filter(item=>!query||[item.email,item.phone,item.name].join(" ").toLowerCase().includes(query));
        const target=member(ui.dialogUser);
        const range=dialogTimeRange();
        const list=target&&range.valid?data.dialogues.filter(item=>item.membershipId===target.id&&range.match(item)).sort((a,b)=>b.at.localeCompare(a.at)):[];
        const inputValue=target&&!ui.dialogPickerOpen?target.name+" · "+target.phone:ui.dialogQuery;
        const choices=candidates.map((item,index)=>`<button type="button" class="dialog-option ${index===ui.dialogActiveIndex?"active":""}" id="dialog-option-${esc(item.id)}" role="option" tabindex="-1" aria-selected="${item.id===ui.dialogUser}" data-action="select-dialog-user" data-id="${esc(item.id)}"><strong>${esc(item.name)}</strong><small>${esc(item.phone)} · ${esc(item.email||"未填写邮箱")}${item.status==="removed"?" · 已移除":""}</small></button>`).join("")||'<div class="dialog-no-options">未找到成员</div>';
        const chooser=`<div class="toolbar dialog-filters"><div class="dialog-picker" id="dialogPicker"><input class="input dialog-picker-input" id="dialogUserSearch" role="combobox" aria-label="搜索邮箱、手机号或人名并选择一位成员" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="dialogUserOptions" aria-expanded="${ui.dialogPickerOpen}" autocomplete="off" placeholder="搜索邮箱、手机号或人名" value="${esc(inputValue)}"><span class="dialog-picker-arrow" aria-hidden="true">⌄</span><div class="dialog-options" id="dialogUserOptions" role="listbox" aria-label="成员列表" ${ui.dialogPickerOpen?"":"hidden"}>${choices}</div></div><div class="dialog-time"><span class="dialog-time-label">时间</span><div class="period-switch" role="group" aria-label="对话时间">${[["1d","近1日"],["7d","近7日"],["1m","近1月"],["custom","自定义"]].map(([value,label])=>`<button type="button" class="period-btn" data-action="dialog-period" data-period="${value}" aria-pressed="${ui.dialogPeriod===value}">${label}</button>`).join("")}</div>${ui.dialogPeriod==="custom"?`<input class="input" type="date" id="dialogStart" aria-label="开始日期" value="${esc(ui.dialogStart)}"><span>至</span><input class="input" type="date" id="dialogEnd" aria-label="结束日期" value="${esc(ui.dialogEnd)}">`:""}</div></div>`;
        const scope=target?`<div class="dialog-scope"><span>当前查询用户</span><strong>${esc(target.name)}</strong><span class="mono">${esc(target.phone)}</span><span>${esc(target.joinedAt)}</span><span class="count">共 ${list.length} 条对话</span></div>`:"";
        const content=!target?`<div class="empty"><b>${candidates.length?"请选择一位成员":"未找到成员"}</b>${candidates.length?"选中成员后查看对话记录。":"请更换搜索条件。"}</div>`:
          !range.valid?`<div class="empty"><b>${esc(range.message)}</b>设置有效的时间范围后查看对话记录。</div>`:
          `<div class="table-wrap"><table class="table" style="min-width:1120px"><thead><tr><th>时间</th><th>用户 ID</th><th>人名</th><th>输入内容</th><th>输出内容</th><th>文件列表</th><th>操作</th></tr></thead><tbody>${list.map(item=>`<tr><td class="mono">${esc(item.at)}</td><td class="mono">${esc(item.userId)}</td><td class="name">${esc(member(item.membershipId)?.name||"—")}</td><td><div class="short-text" title="${esc(item.input)}">${esc(item.input)}</div></td><td><div class="short-text" title="${esc(item.output)}">${esc(item.output)}</div></td><td>${item.files.length?`<div class="tag-list">${item.files.map(file=>`<span class="tag">${esc(file)}</span>`).join("")}</div>`:"—"}</td><td><button class="btn tiny" data-action="dialog-detail" data-id="${item.id}">查看详情</button></td></tr>`).join("")||'<tr><td colspan="7"><div class="empty"><b>该用户在所选时间内暂无对话记录</b></div></td></tr>'}</tbody></table></div>`;
        $("#view").innerHTML=top("对话内容")+`<section class="panel pad">${chooser}${scope}${content}</section>`;
        $("#dialogUserSearch").onfocus=openDialogPicker;
        $("#dialogUserSearch").onclick=openDialogPicker;
        $("#dialogUserSearch").oninput=event=>{const position=event.target.selectionStart;ui.dialogQuery=event.target.value;ui.dialogUser="";ui.dialogPickerOpen=true;ui.dialogActiveIndex=0;renderDialogues();$("#dialogUserSearch").focus();$("#dialogUserSearch").setSelectionRange(position,position)};
        if(ui.dialogPeriod==="custom"){
          $("#dialogStart").onchange=event=>{ui.dialogStart=event.target.value;renderDialogues()};
          $("#dialogEnd").onchange=event=>{ui.dialogEnd=event.target.value;renderDialogues()};
        }
        $("#dialogUserSearch").onkeydown=event=>{
          if(event.key==="Escape"){event.preventDefault();closeDialogPicker();return}
          if(event.key==="Tab"){closeDialogPicker();return}
          if(!["ArrowDown","ArrowUp","Enter"].includes(event.key))return;
          event.preventDefault();
          if(!ui.dialogPickerOpen){openDialogPicker();return}
          if(!candidates.length)return;
          if(event.key==="Enter"){const choice=candidates[ui.dialogActiveIndex];if(choice)chooseDialogUser(choice.id);return}
          ui.dialogActiveIndex+=event.key==="ArrowDown"?1:-1;
          if(ui.dialogActiveIndex<0)ui.dialogActiveIndex=candidates.length-1;
          if(ui.dialogActiveIndex>=candidates.length)ui.dialogActiveIndex=0;
          updateDialogActive(true);
        };
        updateDialogActive();
      }
      function showDialogDetail(id){
        const range=dialogTimeRange();
        const item=data.dialogues.find(row=>row.id===id&&row.membershipId===ui.dialogUser&&range.valid&&range.match(row));
        if(!item)return toast("请先选择有效的对话记录");
        const person=member(item.membershipId);
        $("#dialogDetailSubtitle").textContent=item.at+" · "+(person?.name||item.userId);
        $("#dialogDetailBody").innerHTML=`<div class="detail-meta"><span>用户 ID：${esc(item.userId)}</span><span>时间：${esc(item.at)}</span></div><section class="qa-section"><h3>输入内容</h3><div class="qa-content">${esc(item.input)}</div></section><section class="qa-section output"><h3>输出内容</h3><div class="qa-content">${esc(item.output)}</div></section><section class="qa-section"><h3>文件列表</h3><div class="detail-files">${item.files.length?item.files.map(file=>`<span class="tag">${esc(file)}</span>`).join(""):'<span class="muted">无文件</span>'}</div></section>`;
        $("#dialogDetail").showModal();
      }
      function renderShares(){
        $("#view").innerHTML=top("分享链接")+`<section class="panel pad"><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>用户ID</th><th>人名</th><th>分享类型</th><th>分享链接</th></tr></thead><tbody>${data.shares.map(item=>`<tr><td class="mono">${esc(item.at)}</td><td class="mono">${esc(item.userId)}</td><td class="name">${esc(member(item.membershipId)?.name||"—")}</td><td><span class="pill">${esc(item.type)}</span></td><td><div class="link-text" title="${esc(item.link)}">${esc(item.link)}</div></td></tr>`).join("")||'<tr><td colspan="5"><div class="empty"><b>暂无分享记录</b></div></td></tr>'}</tbody></table></div></section>`;
      }
      function renderDownloads(){
        $("#view").innerHTML=top("文件下载")+`<section class="panel pad"><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>用户ID</th><th>人名</th><th>链接</th></tr></thead><tbody>${data.downloads.map(item=>`<tr><td class="mono">${esc(item.at)}</td><td class="mono">${esc(item.userId)}</td><td class="name">${esc(member(item.membershipId)?.name||"—")}</td><td><div class="link-text" title="${esc(item.link)}">${esc(item.link)}</div></td></tr>`).join("")||'<tr><td colspan="4"><div class="empty"><b>暂无下载记录</b></div></td></tr>'}</tbody></table></div></section>`;
      }
      function renderPoints(){
        const list=data.points.filter(item=>ui.pointUser==="all"||item.membershipId===ui.pointUser);
        $("#view").innerHTML=top("积分记录")+`<section class="panel pad"><div class="toolbar"><select class="select" id="pointUser" aria-label="筛选用户"><option value="all">全部用户</option>${options(data.members,ui.pointUser,item=>item.id,item=>item.name+" · "+item.accountId+" · "+item.joinedAt+(item.status==="removed"?"（已移除）":""))}</select><span class="count">共 ${list.length} 条记录</span></div><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>用户 ID</th><th>类型</th><th>描述</th><th>数量</th></tr></thead><tbody>${list.map(item=>`<tr><td class="mono">${esc(item.at)}</td><td class="mono">${esc(item.userId)}</td><td><span class="pill">${esc(item.type)}</span></td><td>${esc(item.description)}</td><td class="mono">${item.amount>0?"+":""}${item.amount}</td></tr>`).join("")||'<tr><td colspan="5"><div class="empty"><b>暂无积分记录</b></div></td></tr>'}</tbody></table></div></section>`;
        $("#pointUser").onchange=event=>{ui.pointUser=event.target.value;renderPoints()};
      }
      document.addEventListener("click",event=>{
        const pageButton=event.target.closest("[data-page]");if(pageButton){ui.dialogPickerOpen=false;ui.page=pageButton.dataset.page;$("#mobileNav").hidden=true;render();window.scrollTo(0,0);return}
        const button=event.target.closest("[data-action]");if(!button)return;
        const action=button.dataset.action,id=button.dataset.id;
        if(action==="close-modal")return closeModal();
        if(action==="close-dialog-detail")return $("#dialogDetail").close();
        if(action==="add-member")return memberForm();
        if(action==="edit-member")return memberForm(id);
        if(action==="request-seat-adjustment")return showModal("席位调整","如需调整机构采购的席位，请发起席位调整工单或联系销售。当前工作台暂不支持在线提交。","",'<button class="btn primary" data-action="close-modal">知道了</button>');
        if(action==="filter-seat-type"){ui.seatType=button.dataset.type;ui.seatStatus="all";ui.seatKeyword="";return renderSeats()}
        if(action==="filter-seat-unassigned"){ui.seatType=button.dataset.type;ui.seatStatus="unassigned";ui.seatKeyword="";return renderSeats()}
        if(action==="toggle-member"){const item=member(id);if(!item||item.owner||item.status==="removed")return toast("无法修改该成员状态");item.status=item.status==="enabled"?"disabled":"enabled";save();render();return toast(item.status==="enabled"?"成员已启用":"成员已停用")}
        if(action==="remove-member"){const item=member(id);if(!item||item.owner||item.status==="removed")return toast("无法移除该成员");const occupied=data.seats.filter(row=>row.memberId===id);return confirmAction("移除成员？",`移除 ${item.name} 后将释放其 ${occupied.length} 个席位，历史记录保留。`,()=>{item.status="removed";for(const slot of occupied)slot.memberId=null;save();render();toast("成员已移除，席位已释放")})}
        if(action==="assign-seat")return seatForm(id);
        if(action==="change-seat-user")return seatForm(id,true);
        if(action==="release-seat"){const slot=data.seats.find(item=>item.id===id),target=member(slot?.memberId);if(!slot||!target)return toast("席位分配已变更");return confirmAction("释放席位？",`${slot.id} 将变为待分配，剩余积分保留在该席位。`,()=>{slot.memberId=null;save();render();toast("席位已释放")})}
        if(action==="select-dialog-user")return chooseDialogUser(id);
        if(action==="dialog-period"){ui.dialogPeriod=button.dataset.period;ui.dialogPickerOpen=false;return renderDialogues()}
        if(action==="dialog-detail")return showDialogDetail(id);
        if(action==="account-info"){closeAccount();return showModal("账号信息","",'<div class="detail-row"><span>人名</span><b>林依然</b></div><div class="detail-row"><span>身份</span><b>机构 Owner</b></div><div class="detail-row"><span>当前机构</span><b>万得</b></div>','<button class="btn primary" data-action="close-modal">关闭</button>')}
      });
      function toggleAccount(trigger){const menu=$("#accountMenu"),open=menu.hidden;menu.hidden=!open;for(const button of [$("#accountTrigger"),$("#mobileAccountTrigger")])button.setAttribute("aria-expanded",String(open));if(open){const rect=trigger.getBoundingClientRect();menu.style.left=Math.max(12,Math.min(rect.left,innerWidth-menu.offsetWidth-12))+"px";menu.style.top=(rect.top>menu.offsetHeight+8?rect.top-menu.offsetHeight-8:rect.bottom+8)+"px"}}
      function closeAccount(){$("#accountMenu").hidden=true;for(const button of [$("#accountTrigger"),$("#mobileAccountTrigger")])button.setAttribute("aria-expanded","false")}
      $("#accountTrigger").onclick=()=>toggleAccount($("#accountTrigger"));
      $("#mobileAccountTrigger").onclick=()=>toggleAccount($("#mobileAccountTrigger"));
      document.addEventListener("click",event=>{if(!event.target.closest("#accountTrigger")&&!event.target.closest("#mobileAccountTrigger")&&!event.target.closest("#accountMenu"))closeAccount()});
      document.addEventListener("click",event=>{if(ui.page==="dialogues"&&!event.target.closest("#dialogPicker"))closeDialogPicker()});
      document.addEventListener("keydown",event=>{if(event.key==="Escape")closeAccount()});
      $("#mobileTrigger").onclick=()=>{$("#mobileNav").hidden=!$("#mobileNav").hidden};
      $("#modal").onclick=event=>{if(event.target===$("#modal"))closeModal()};
      $("#dialogDetail").onclick=event=>{const rect=$("#dialogDetail").getBoundingClientRect();if(event.target===$("#dialogDetail")&&(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom))$("#dialogDetail").close()};
      render();
    })();
  </script>
</body>
</html>
