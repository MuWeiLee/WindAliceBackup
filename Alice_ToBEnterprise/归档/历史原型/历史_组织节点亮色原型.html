    /* 企业管理后台视觉系统：沿用 V4 蓝灰色系，统一独立后台组件 */

      const groups=usageScope==="all"?(managerView?scopes.filter(n=>!allowed.has(n.parent)):data.nodes.filter(n=>!n.parent)):scopes.filter(n=>n.parent===usageScope);
      $("#view").innerHTML=head("","积分使用","")+
      `<div class="toolbar"><select class="select" id="usageScope"><option value="all">${managerView?"管理范围":"万得"}</option>${scopes.map(n=>`<option value="${n.id}" ${usageScope===n.id?"selected":""}>${esc(nodePathLabel(n.id))}</option>`).join("")}</select></div><div class="kpis">${kpi("成员数",members.length)}${kpi("累计用量",money(sum))}${kpi("使用中成员",members.filter(m=>m.usage>0).length)}${kpi("人均用量",money(members.length?Math.round(sum/members.length):0))}</div><div class="section-grid"><section class="panel pad"><div class="section-title"><h2>成员用量</h2></div>${members.sort((a,b)=>b.usage-a.usage).map(m=>`<div class="usage-line"><span>${esc(m.name)}</span><div class="bar"><em style="width:${Math.max(3,sum?m.usage/sum*100:0)}%"></em></div><b>${money(m.usage)}</b></div>`).join("")||'<div class="blank"><b>暂无使用记录</b></div>'}</section><section class="panel pad"><div class="section-title"><h2>组织用量</h2></div>${groups.map(n=>{const total=nodeMembers(n.id).reduce((v,m)=>v+m.usage,0);return `<div class="usage-line"><span>${esc(n.name)}</span><div class="bar"><em style="width:${Math.max(3,sum?total/sum*100:0)}%"></em></div><b>${money(total)}</b></div>`}).join("")||'<div class="blank"><b>暂无下级组织</b></div>'}</section></div>`;
      $("#usageScope").onchange=e=>{usageScope=e.target.value;renderUsage()};
    }
    function visibleContent(){if(role==="owner")return data.content;const allowed=managedNodeIds();return data.content.filter(c=>{const m=member(c.creatorId);return m?.nodeId&&allowed.has(m.nodeId)})}
    function renderContent(){
      const types=["对话请求","执行记录","生成素材"];
      const list=visibleContent().filter(c=>types.includes(c.type)&&(contentFilter==="all"||c.type===contentFilter));
      $("#view").innerHTML=head("","内容生成","")+
      `<div class="panel pad"><div class="toolbar"><select class="select" id="contentFilter" aria-label="内容类型"><option value="all">全部类型</option>${types.map(t=>`<option value="${t}" ${contentFilter===t?"selected":""}>${t}</option>`).join("")}</select><span class="small muted">共 ${list.length} 条记录</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>标题</th><th>类型</th><th>创建者</th><th>所属组织</th><th>时间</th><th>操作</th></tr></thead><tbody>${list.map(c=>`<tr><td><div class="name">${esc(c.title)}</div></td><td><span class="pill">${esc(c.type)}</span></td><td>${esc(c.creator)}</td><td>${esc(member(c.creatorId)?.nodeId?nodePathLabel(member(c.creatorId).nodeId):"未分配")}</td><td>${esc(c.date)}</td><td><button class="btn tiny" data-action="content-detail" data-id="${c.id}">查看详情</button></td></tr>`).join("")||'<tr><td colspan="6"><div class="blank"><b>暂无内容记录</b></div></td></tr>'}</tbody></table></div></div>`;
      $("#contentFilter").onchange=e=>{contentFilter=e.target.value;renderContent()};
    }
    function renderShares(){
      const types=["分享记录","下载记录"];
      const list=visibleContent().filter(c=>types.includes(c.type)&&(shareFilter==="all"||c.type===shareFilter));
      $("#view").innerHTML=head("","分享下载","")+
      `<div class="panel pad"><div class="toolbar"><select class="select" id="shareFilter" aria-label="记录类型"><option value="all">全部类型</option>${types.map(t=>`<option value="${t}" ${shareFilter===t?"selected":""}>${t}</option>`).join("")}</select><span class="small muted">共 ${list.length} 条记录</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>产物</th><th>操作</th><th>成员</th><th>所属组织</th><th>时间</th><th>详情</th></tr></thead><tbody>${list.map(c=>`<tr><td><div class="name">${esc(c.title)}</div></td><td><span class="pill">${esc(c.type==="分享记录"?"分享":"下载")}</span></td><td>${esc(c.creator)}</td><td>${esc(member(c.creatorId)?.nodeId?nodePathLabel(member(c.creatorId).nodeId):"未分配")}</td><td>${esc(c.date)}</td><td><button class="btn tiny" data-action="content-detail" data-id="${c.id}">查看详情</button></td></tr>`).join("")||'<tr><td colspan="6"><div class="blank"><b>暂无分享或下载记录</b></div></td></tr>'}</tbody></table></div></div>`;
      $("#shareFilter").onchange=e=>{shareFilter=e.target.value;renderShares()};
    }
    function contentDetail(id){
      const c=visibleContent().find(x=>x.id===id);if(!c)return toast("无权查看该内容");
      audit("查看机构内容",c.title);save();
      modal(c.title,c.type+" · "+c.creator+" · "+c.date,`<div class="stat-pair"><span>内容类型</span><b>${esc(c.type)}</b></div><div class="stat-pair"><span>创建者</span><b>${esc(c.creator)}</b></div><div class="stat-pair"><span>所属组织</span><b>${esc(member(c.creatorId)?.nodeId?nodePathLabel(member(c.creatorId).nodeId):"未分配")}</b></div><p style="font-size:13px;line-height:1.8;margin-top:19px">${esc(c.summary)}</p><div class="field-help">仅展示演示摘要，非真实对话或执行详情。</div>`,'<button class="btn primary" data-action="close-modal">关闭</button>');
    }
    function renderAdmins(){
      const grants=data.nodes.flatMap(n=>n.admins.map(id=>({n,m:member(id)}))).filter(g=>g.m&&g.m.status==="active"&&inTree(g.m.nodeId,g.n.id));
      $("#view").innerHTML=head("","管理员","",`<button class="btn primary" data-action="add-admin">${icon("plus")}设置节点 Admin</button>`)+
      `<section class="panel pad"><div class="section-title"><h2>节点授权</h2><span>${new Set(grants.map(g=>g.m.id)).size} 位节点 Admin · ${grants.length} 项授权</span></div><div class="admin-card"><div class="person-main"><span class="person-avatar">${esc((data.members.find(m=>m.role==="owner")?.name||"机构").slice(0,1))}</span><div><b>${esc(data.members.find(m=>m.role==="owner")?.name||"机构 Owner")}</b><small>机构 Owner · 默认管理所有节点</small></div></div><span class="pill purple">不可撤销</span></div>${grants.map(({n,m})=>`<div class="admin-card"><div class="person-main"><span class="person-avatar">${esc(m.name.slice(0,1))}</span><div><b>${esc(m.name)}</b><small>成员归属：${esc(nodePathLabel(m.nodeId))}<br>管理范围：${esc(nodePathLabel(n.id))}及下级</small></div></div><div class="actions"><span class="pill purple">节点 Admin</span><button class="btn tiny danger" data-action="revoke-admin" data-id="${m.id}" data-node-id="${n.id}">撤销</button></div></div>`).join("")}</section>`;
    }
    function addAdmin(){
      if(role!=="owner")return toast("无权设置管理员");
      modal("设置节点 Admin","仅可选择该节点及下级的有效成员",`<div class="field"><label>授权节点</label><select id="adminNode"><option value="">请选择</option>${data.nodes.map(n=>`<option value="${n.id}">${esc(nodePathLabel(n.id))}</option>`).join("")}</select></div><div class="field"><label>选择成员</label><select id="adminCandidate"><option value="">请先选择节点</option></select></div>`,
        '<button class="btn" data-action="close-modal">取消</button><button class="btn primary" id="confirmAdmin">确认授权</button>');
      $("#adminNode").onchange=()=>{const n=node($("#adminNode").value);$("#adminCandidate").innerHTML='<option value="">请选择成员</option>'+activeMembers().filter(m=>n&&m.role==="member"&&m.nodeId&&inTree(m.nodeId,n.id)&&!n.admins.includes(m.id)).map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(nodePathLabel(m.nodeId))}</option>`).join("")};
      $("#confirmAdmin").onclick=()=>{const m=member($("#adminCandidate").value),n=node($("#adminNode").value);if(!m||!n)return toast("请选择成员和授权节点");if(m.status!=="active"||m.role!=="member"||!inTree(m.nodeId,n.id))return toast("该成员不在授权节点及下级");if(n.admins.includes(m.id))return toast("该节点已授权此成员");n.admins.push(m.id);audit("设置节点 Admin",n.name+" · "+m.name);save();closeModal();render();toast("节点 Admin 已设置")};
    }
    function renderAudit(){
      $("#view").innerHTML=head("","操作日志","")+
      `<section class="panel pad"><div class="section-title"><h2>最近变更</h2></div>${data.audit.map(a=>`<div class="audit-row"><time>${esc(a.at)}</time><div><b>${esc(a.action)}</b><small>${esc(a.target)}</small></div><span class="muted">${esc(a.actor)}</span></div>`).join("")}</section>`;
    }
    document.addEventListener("click",e=>{
      const pageEl=e.target.closest("[data-page]");if(pageEl){closeAccount();page=pageEl.dataset.page;if(page==="permissions")featureScope=selectedNode;render();window.scrollTo(0,0);return}
      const el=e.target.closest("[data-action]");if(!el)return;const a=el.dataset.action,id=el.dataset.id,nodeId=el.dataset.nodeId;
      if(a==="toggle-account")return toggleAccount(el);
      if(a==="account-info"){closeAccount();return accountInfo()}
      if(a==="account-permissions"){closeAccount();return accountPermissions()}
      if(a==="close-modal")return closeModal();
      if(a==="add-member")return memberForm();
      if(a==="add-node-member")return memberForm(null,id);
      if(a==="edit-member")return memberForm(id);
      if(a==="remove-member"){const m=member(id);if(!m||m.role==="owner"||!canEdit(m))return toast("无权移除该成员");return ask("移除 "+m.name+"？","成员将从正常列表隐藏，席位收回，历史资料保留。",()=>{if(!canEdit(m))return toast("无权移除该成员");m.status="removed";m.seat=false;for(const n of data.nodes)n.admins=n.admins.filter(x=>x!==id);audit("移除机构成员",m.name);save();render();toast("成员已移除")})}
      if(a==="restore-member"){const m=member(id);if(!m||!canEdit(m))return toast("无权恢复该成员");m.status="active";audit("恢复机构成员",m.name);save();render();return toast("成员已恢复")}
      if(a==="add-node")return createNode(null);
      if(a==="add-child")return createNode(id);
      if(a==="save-node")return saveNode();
      if(a==="set-quota")return setQuota(id);
      if(a==="assign-seat")return assignSeat(id);
      if(a==="revoke-seat")return revokeSeat(id);
      if(a==="toggle-feature-grant")return toggleFeatureGrant(nodeId,id);
      if(a==="toggle-feature")return toggleFeature(nodeId,id);
      if(a==="assign-node-admin"){if(role!=="owner")return toast("无权设置 Admin");const n=node(selectedNode),m=member($("#nodeAdminPicker").value);if(!n||!m||m.status!=="active"||m.role!=="member"||!inTree(m.nodeId,n.id))return toast("请选择该节点或下级的有效成员");if(!n.admins.includes(m.id))n.admins.push(m.id);audit("设置节点 Admin",n.name+" · "+m.name);save();nav();renderOrg();return toast("节点 Admin 已设置")}
      if(a==="remove-node-admin"){if(role!=="owner")return toast("无权设置 Admin");const n=node(selectedNode);n.admins=n.admins.filter(x=>x!==id);audit("撤销 Admin",n.name+" · "+member(id)?.name);save();nav();renderOrg();return toast("授权已撤销")}
      if(a==="delete-node"){if(role!=="owner")return toast("无权删除组织节点");const n=node(selectedNode);if(data.nodes.some(x=>x.parent===n.id)||data.members.some(m=>m.nodeId===n.id&&m.status!=="removed"))return toast("请先迁移下级节点和成员");if(n.quota>0)return toast("请先收回节点席位");return ask("删除组织节点？",n.name+" 将被删除。",()=>{data.nodes=data.nodes.filter(x=>x.id!==n.id);layoutNodes(data.nodes);selectedNode=data.nodes[0]?.id||null;audit("删除组织节点",n.name);save();renderOrg();toast("节点已删除")})}
      if(a==="zoom-in"||a==="zoom-out"){scale=Math.max(.65,Math.min(1.4,scale+(a==="zoom-in"?.1:-.1)));return renderOrg()}
      if(a==="auto-layout")return autoLayout();
      if(a==="add-admin")return addAdmin();
      if(a==="revoke-admin"){if(role!=="owner")return toast("无权设置 Admin");const m=member(id),n=node(nodeId);if(!m||!n||!n.admins.includes(id))return toast("授权已失效");return ask("撤销 Admin 权限？",m.name+" 将失去"+n.name+"及下级的管理权限。",()=>{n.admins=n.admins.filter(x=>x!==id);audit("撤销 Admin",n.name+" · "+m.name);save();render();toast("授权已撤销")})}
      if(a==="content-detail")return contentDetail(id);
    });
    document.addEventListener("click",e=>{if(!$("#accountMenu").hidden&&!e.target.closest("#accountMenu")&&!e.target.closest("[data-action='toggle-account']"))closeAccount()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#accountMenu").hidden){e.preventDefault();closeAccount(true)}});
    window.addEventListener("resize",()=>closeAccount());
    window.addEventListener("scroll",()=>closeAccount());
    $("#roleSelect").onchange=e=>{role=e.target.value;usageScope="all";if(isAdmin()){const first=visibleNodes()[0];page="org";selectedNode=first?.id||null;orgScroll=first?Math.max(0,first.y*scale-130):0}else if(page==="admins"&&role!=="owner")page="overview";render();closeAccount();toast("已切换为 "+(role==="owner"?"拥有者":"Admin"))};
    $("#menuToggle").onclick=()=>{closeAccount();$("#mobileNav").hidden=!$("#mobileNav").hidden};
    $("#modal").addEventListener("click",e=>{if(e.target===$("#modal"))closeModal()});
    save();
    render();
  })();
  </script>
</body>
</html>
