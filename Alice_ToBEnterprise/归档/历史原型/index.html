<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wind Alice · 机构管理平台原型</title>
  <style>
    :root{--ink:#15212d;--muted:#667786;--line:#dbe3e8;--paper:#f2f5f5;--white:#fff;--blue:#0c6a78;--blue2:#075360;--pale:#e7f3f3;--gold:#b87923;--warn:#fff1d9;--red:#b84242;--redp:#fff0ee;--green:#267456;--greenp:#eaf5ee;--radius:12px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a{color:inherit}
    .app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.side{background:#102d39;color:#d9e7e9;padding:26px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 12px}.brand-mark{width:34px;height:34px;background:#b8e2dc;color:#0d3c46;border-radius:9px;display:grid;place-items:center;font-family:Georgia,serif;font-size:25px;font-weight:bold}.brand strong{color:white;font-size:17px;letter-spacing:.02em}.brand small{display:block;color:#9eb8be;font-size:11px;margin-top:2px;letter-spacing:.1em}.side-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#87a3aa;padding:0 13px;margin:0 0 7px}.nav{display:grid;gap:3px}.nav button{width:100%;border:0;background:transparent;color:#d1e0e3;text-align:left;padding:11px 13px;border-radius:9px;display:flex;gap:12px;align-items:center}.nav button:hover{background:#20414d}.nav button.active{background:#dff0ed;color:#103943;font-weight:700}.nav .icon{width:21px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border-top:1px solid #31515c;padding:18px 12px 0;color:#a8c0c4;font-size:12px;line-height:1.7}.side-bottom b{color:#e7f2f2}
    .main{min-width:0}.top{height:72px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px}.top-left,.top-right{display:flex;align-items:center;gap:13px}.top small{color:var(--muted)}.org-select{max-width:260px;border:1px solid var(--line);background:#f9fbfb;border-radius:8px;padding:9px 12px;color:var(--ink);font-weight:700}.avatar{height:34px;width:34px;border-radius:50%;background:#c7dcd7;color:#174e50;display:grid;place-items:center;font-weight:700}.content{max-width:1370px;margin:auto;padding:35px 38px 75px}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 0 25px}.heading h1{font-family:"Songti SC","SimSun",serif;font-size:31px;line-height:1.25;margin:6px 0}.heading p{color:var(--muted);margin:0;line-height:1.6}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:9px 14px;min-height:38px;font-weight:650}.btn:hover{border-color:#89aeb1;background:#f7fbfa}.btn.primary{border-color:var(--blue);background:var(--blue);color:white}.btn.primary:hover{background:var(--blue2)}.btn.danger{color:var(--red);border-color:#ebc5c2}.btn.tiny{padding:6px 9px;min-height:29px;font-size:12px}.btn.text{border:0;background:transparent;color:var(--blue)}.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 9px #18313a08}.panel-pad{padding:22px}.grid{display:grid;gap:15px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.metric{padding:20px 22px;min-height:137px}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:32px;font-family:Georgia,"Songti SC",serif;margin:10px 0 3px;letter-spacing:-.025em}.metric .hint{font-size:12px;color:var(--muted)}.section-grid{grid-template-columns:1.3fr 1fr;align-items:start}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px}.section-head h2{font-family:"Songti SC","SimSun",serif;margin:0;font-size:21px}.section-head small{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:5px 9px;background:var(--greenp);color:var(--green);font-size:12px;font-weight:750;white-space:nowrap}.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.pending{background:var(--warn);color:#9a651d}.status.disabled,.status.removed,.status.expired{background:var(--redp);color:var(--red)}.notice{padding:13px 16px;background:#e8f0f0;border-left:3px solid var(--blue);border-radius:6px;color:#35515a;font-size:13px;line-height:1.65;margin-bottom:18px}.notice.warn{background:#fff4e2;border-color:var(--gold);color:#795b2e}.notice.critical{background:#fff0ee;border-color:var(--red);color:#8b4141}.list{display:grid}.list-item{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:14px 0;border-top:1px solid #edf0f1}.list-item:first-child{border-top:0}.list-item b{font-size:14px}.list-item small{display:block;color:var(--muted);margin-top:4px}.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}.progress{height:8px;border-radius:10px;background:#e5eded;overflow:hidden;margin:15px 0 9px}.progress span{display:block;height:100%;background:var(--blue)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:10px 12px;outline:none}.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0c6a781a}.toolbar input{min-width:240px;flex:1}.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{background:none;border:0;border-bottom:2px solid transparent;padding:11px 17px;color:var(--muted);font-weight:700}.tab.active{color:var(--blue);border-color:var(--blue)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{text-align:left;color:var(--muted);font-weight:650;font-size:12px;padding:13px 15px;background:#f7f9f9;white-space:nowrap}.table td{border-top:1px solid #edf0f1;padding:14px 15px;font-size:13px;vertical-align:middle}.table tr:hover td{background:#fbfcfc}.table .person{font-weight:750}.table .sub{font-size:11px;color:var(--muted);margin-top:4px}.row-actions{display:flex;gap:3px;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:46px 15px;line-height:1.8}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}.badge{display:inline-block;background:#eaf0f2;color:#45616b;padding:5px 8px;border-radius:6px;font-size:12px;font-weight:700}.detail-pairs{display:grid;grid-template-columns:150px 1fr;gap:13px 18px;font-size:13px}.detail-pairs dt{color:var(--muted)}.detail-pairs dd{margin:0;line-height:1.65;overflow-wrap:anywhere}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0;border-top:1px solid #edf0f1}.switch-row:first-child{border-top:0}.switch-row small{display:block;color:var(--muted);margin-top:4px;line-height:1.5}.switch{appearance:none;width:39px;height:23px;background:#c6d2d6;border-radius:20px;position:relative;flex:none;cursor:pointer}.switch:after{content:"";position:absolute;width:17px;height:17px;background:white;border-radius:50%;left:3px;top:3px;transition:transform .2s}.switch:checked{background:var(--blue)}.switch:checked:after{transform:translateX(16px)}.switch:disabled{opacity:.5;cursor:not-allowed}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pill{display:inline-block;font-size:11px;background:var(--pale);color:var(--blue);padding:4px 8px;border-radius:5px;margin-right:5px}.mock-only{font-size:12px;color:#7b632d;background:#fff2dc;border-radius:6px;padding:8px 10px;display:inline-block}.footer-note{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.7}
    dialog{border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 80px #0c293947;padding:0;width:min(520px,calc(100vw - 30px));max-height:calc(100vh - 30px)}dialog::backdrop{background:#0b293b77}.dialog-head{padding:22px 24px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:start}.dialog-head h2{margin:0;font-family:"Songti SC","SimSun",serif;font-size:23px}.dialog-head p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.55}.dialog-body{padding:22px 24px;overflow:auto;max-height:55vh}.dialog-foot{padding:15px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.field{display:grid;gap:6px;margin-bottom:16px;font-size:13px;font-weight:700}.field small{font-weight:400;color:var(--muted);line-height:1.5}.field textarea{min-height:90px;resize:vertical}.x{border:0;background:none;font-size:22px;color:var(--muted);line-height:1}.toast{position:fixed;bottom:25px;right:26px;background:#133c47;color:white;padding:13px 17px;border-radius:9px;box-shadow:0 7px 30px #0e303643;font-size:13px;z-index:30}.mobile-toggle{display:none}
    @media(max-width:1100px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.section-grid{grid-template-columns:1fr}.content{padding:28px 24px 60px}}@media(max-width:740px){.app{grid-template-columns:1fr}.side{display:none;position:fixed;z-index:20;inset:0 auto 0 0;width:248px}.side.open{display:flex}.mobile-toggle{display:inline-block}.top{padding:0 15px}.top small,.top-right .avatar{display:none}.content{padding:22px 15px 60px}.heading{align-items:start;flex-direction:column}.heading h1{font-size:27px}.metrics,.split{grid-template-columns:1fr}.metric{min-height:100px}.org-select{max-width:170px}.detail-pairs{grid-template-columns:100px 1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="brand-mark">A</span><span><strong>Wind Alice</strong><small>INSTITUTION CONSOLE</small></span></div>
    <div><p class="side-label">工作空间</p><nav class="nav" id="nav"></nav></div>
    <div class="side-bottom"><b>机构管理平台 · 原型 V1.0</b><br>仅演示本机构管理行为。机构开通、席位授权与积分配置由后台管理系统负责。</div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="top-left"><button class="btn mobile-toggle" id="mobileToggle" aria-label="打开导航">☰</button><span class="muted">当前机构</span><select id="orgSelect" class="org-select" aria-label="切换管理机构"></select><span id="topStatus"></span></div>
      <div class="top-right"><small>独立管理控制台 · 演示数据</small><span class="avatar">林</span><b style="font-size:13px">林依然 · Owner</b></div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<dialog id="modal"><div class="dialog-head"><div><h2 id="modalTitle"></h2><p id="modalSub"></p></div><button class="x" id="closeModal" aria-label="关闭">×</button></div><div class="dialog-body" id="modalBody"></div><div class="dialog-foot" id="modalFoot"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  const initial = [
    {id:"org-001",name:"华辰证券研究院",state:"有效",seats:12,points:200000,used:86420,owner:"林依然",members:[
      {id:"m1",name:"林依然",phone:"13800138000",email:"lin@huachen.example",dept:"研究管理",role:"Owner",status:"正常",joined:"2026-09-18",last:"2026-10-08"},
      {id:"m2",name:"张澄",phone:"13900139001",email:"zhang@huachen.example",dept:"行业研究",role:"Admin",status:"正常",joined:"2026-09-20",last:"2026-10-08"},
      {id:"m3",name:"陈遥",phone:"13700137002",email:"chen@huachen.example",dept:"策略研究",role:"Member",status:"正常",joined:"2026-09-24",last:"2026-10-07"},
      {id:"m4",name:"王知秋",phone:"13600136003",email:"",dept:"财富管理",role:"Member",status:"已禁用",joined:"2026-09-28",last:"2026-10-01"}
    ],invites:[{id:"i1",name:"李沐",phone:"13500135004",role:"Member",status:"待接受",sent:"2026-10-07",expires:"2026-10-14"}],
    content:[
      {id:"c1",type:"对话请求",title:"半导体行业景气度分析",creator:"陈遥",date:"2026-10-08 09:36",body:"用户请求：梳理半导体产业链的近期景气变化，并列出需要继续验证的数据。\\n\\nAlice 回复摘要：按设计、制造、封测及设备环节拆分，并提示结合最新公开数据复核。"},
      {id:"c2",type:"生成素材",title:"四季度策略路演材料",creator:"张澄",date:"2026-10-07 16:24",body:"成果类型：演示文稿。\\n版本：V2。\\n内容摘要：市场环境、行业比较、情景假设与主要风险。"},
      {id:"c3",type:"分享链接",title:"新能源产业跟踪摘要",creator:"陈遥",date:"2026-10-06 11:52",body:"链接状态：有效。\\n访问范围：持有链接者。\\n原型不生成或访问真实分享地址。"}
    ],audit:[{when:"2026-10-08 10:18",who:"林依然",action:"查看成员内容",object:"四季度策略路演材料",result:"成功"},{when:"2026-10-07 15:03",who:"张澄",action:"发起成员邀请",object:"李沐",result:"成功"}],adminPerm:{invite:true,edit:true,disable:true,remove:false,content:true,audit:true},memberPerm:{chat:true,work:true,share:true,automation:false}},
    {id:"org-002",name:"远澜资产管理",state:"有效",seats:6,points:80000,used:26170,owner:"林依然",members:[
      {id:"n1",name:"林依然",phone:"13800138000",email:"lin@yuanlan.example",dept:"管理",role:"Owner",status:"正常",joined:"2026-09-30",last:"2026-10-08"},
      {id:"n2",name:"周闻",phone:"13500135021",email:"",dept:"投资研究",role:"Member",status:"正常",joined:"2026-10-02",last:"2026-10-07"}],
      invites:[],content:[{id:"d1",type:"对话请求",title:"宏观数据晨间解读",creator:"周闻",date:"2026-10-07 08:46",body:"用户请求：整理当日重要宏观数据及其对市场的可能影响。\\n\\nAlice 回复摘要：按公开数据来源整理并标记待确认项。"}],audit:[],adminPerm:{invite:true,edit:true,disable:true,remove:false,content:true,audit:true},memberPerm:{chat:true,work:true,share:false,automation:false}}
  ];
  const savedWorkspace=(()=>{try{return localStorage.getItem("alice-demo-workspace")||"personal"}catch{return "personal"}})();
  const state = {orgs:structuredClone(initial),org:0,page:"overview",memberFilter:"全部",inviteFilter:"全部",contentType:"全部",query:"",contentQuery:"",auditQuery:"",workspace:savedWorkspace};
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const org = () => state.orgs[state.org];
  const activeInvites = () => org().invites.filter(x=>x.status==="待接受").length;
  const occupied = () => org().members.filter(x=>["正常","已禁用"].includes(x.status)).length;
  const available = () => Math.max(0,org().seats-occupied()-activeInvites());
  const mask = p => p.slice(0,3)+"****"+p.slice(-4);
  const status = s => `<span class="status ${s==="待接受"?"pending":s==="已禁用"?"disabled":s==="已移除"?"removed":""}">${esc(s)}</span>`;
  const date = () => new Date().toLocaleString("zh-CN",{hour12:false});
  const heading = (label,title,desc,actions="") => `<div class="heading"><div><div class="eyebrow">${label}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;
  const panel = (content,cls="") => `<section class="panel panel-pad ${cls}">${content}</section>`;
  const metric = (label,value,hint) => `<div class="panel metric"><div class="label">${label}</div><div class="value num">${value}</div><div class="hint">${hint}</div></div>`;
  const audit = (action,object,result="成功") => org().audit.unshift({when:date(),who:"林依然",action,object,result});
  const toast = msg => {$("#toast").innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$("#toast").innerHTML="",3400)};
  const navItems=[["overview","◇","机构概览"],["members","♙","成员管理"],["content","▤","内容管理"],["permissions","⚑","权限设置"],["usage","◫","使用与额度"],["audit","☷","操作审计"],["organization","ⓘ","机构信息"],["workspace","↗","Alice 工作区"]];
  function render(){
    $("#nav").innerHTML=navItems.map(([id,icon,label])=>`<button data-page="${id}" class="${state.page===id?"active":""}"><span class="icon">${icon}</span>${label}</button>`).join("");
    $("#orgSelect").innerHTML=state.orgs.map((x,i)=>`<option value="${i}" ${i===state.org?"selected":""}>${esc(x.name)}</option>`).join("");
    $("#topStatus").innerHTML=status(org().state);
    const routes={overview:overview,members:members,content:content,permissions:permissions,usage:usage,audit:auditPage,organization:organization,workspace:workspace};
    $("#view").innerHTML=routes[state.page]();
    document.title=`${navItems.find(x=>x[0]===state.page)[2]} · Wind Alice 机构管理平台原型`;
  }
  function overview(){
    const o=org();const pct=Math.min(100,Math.round((occupied()+activeInvites())/o.seats*100));
    return heading("INSTITUTION / OVERVIEW","机构概览",`${esc(o.name)} · 管理范围仅限当前机构`,`<button class="btn primary" data-action="invite">＋ 邀请成员</button>`)
      +`<div class="notice">本控制台用于机构内治理。机构开通、席位上限和积分额度来自后台管理系统；当前页面为虚构数据的交互原型。</div>`
      +`<div class="grid metrics">${metric("有效成员",o.members.filter(x=>x.status==="正常").length,"含 Owner、Admin、Member")}${metric("席位占用",`${occupied()+activeInvites()} / ${o.seats}`,`${occupied()} 正式 · ${activeInvites()} 预留`)}${metric("待接受邀请",activeInvites(),"邀请接受后转为正式占用")}${metric("剩余积分",(o.points-o.used).toLocaleString(),"具体扣费口径待确认")}</div>`
      +`<div class="grid section-grid">
       ${panel(`<div class="section-head"><h2>需要关注</h2><button class="btn text" data-page="members">查看成员 →</button></div><div class="list">
       <div class="list-item"><div><b>席位使用</b><small>已占用 ${occupied()}，预留 ${activeInvites()}，剩余 ${available()}</small></div>${status(available()?"可邀请":"已满额")}</div>
       <div class="progress"><span style="width:${pct}%"></span></div>
       <div class="list-item"><div><b>待接受邀请</b><small>${activeInvites()?org().invites.filter(x=>x.status==="待接受").map(x=>esc(x.name)).join("、"):"目前没有待接受邀请"}</small></div><button class="btn tiny" data-page="members" data-tab="invites">查看</button></div>
       <div class="list-item"><div><b>机构权限</b><small>Admin 和 Member 的功能权限可由机构配置</small></div><button class="btn tiny" data-page="permissions">查看</button></div></div>`)}
       ${panel(`<div class="section-head"><h2>最近管理活动</h2><button class="btn text" data-page="audit">全部记录 →</button></div><div class="list">${o.audit.length?o.audit.slice(0,4).map(x=>`<div class="list-item"><div><b>${esc(x.action)}</b><small>${esc(x.who)} · ${esc(x.object)}</small></div><small class="muted">${esc(x.when)}</small></div>`).join(""):`<div class="empty">暂无管理活动记录</div>`}</div>`)}
      </div><p class="footer-note">演示口径：Owner/Admin/Member 均计入席位；待接受邀请预留席位。此口径待业务确认。</p>`;
  }
  function members(){
    const o=org(),invTab=state.memberTab==="invites";
    let rows=o.members.filter(m=>(state.memberFilter==="全部" || m.status===state.memberFilter) && (m.name.includes(state.query)||m.phone.includes(state.query)||m.dept.includes(state.query)));
    const invs=o.invites.filter(i=>(state.inviteFilter==="全部"||i.status===state.inviteFilter)&&(i.name.includes(state.query)||i.phone.includes(state.query)));
    return heading("PEOPLE / ACCESS","成员管理","成员资料只在当前机构内使用，不改变用户的统一账号资料。",`<button class="btn primary" data-action="invite" ${available()?"":"disabled"}>＋ 邀请成员</button>`)
    +(available()? "":`<div class="notice warn">当前没有可预留席位。机构席位上限由后台管理系统设置，请先处理占用或联系平台扩容。</div>`)
    +`<div class="tabs"><button class="tab ${!invTab?"active":""}" data-member-tab="members">成员列表</button><button class="tab ${invTab?"active":""}" data-member-tab="invites">邀请记录 ${activeInvites()?`· ${activeInvites()}`:""}</button></div>`

      audit("编辑成员资料",m.name);close();render();toast("成员资料已更新");return;
    }
    if(a==="submit-invite"){
      const phone=$("#invitePhone").value.trim(),name=$("#inviteName").value.trim(),email=$("#inviteEmail").value.trim(),dept=$("#inviteDept").value.trim();
      if(!/^1\d{10}$/.test(phone)){toast("请输入有效的 11 位手机号");$("#invitePhone").focus();return}
      if(!name){toast("请填写机构内姓名");$("#inviteName").focus();return}
      if(available()<=0){toast("没有可预留席位");return}
      if(org().members.some(x=>x.phone===phone&&x.status!=="已移除")||org().invites.some(x=>x.phone===phone&&x.status==="待接受")){toast("该手机号已是本机构成员或有待接受邀请");return}
      const sent=new Date(),expires=new Date(sent.getTime()+7*864e5);
      org().invites.unshift({id:"i"+Date.now(),phone,name,email,dept,role:"Member",status:"待接受",sent:sent.toISOString().slice(0,10),expires:expires.toISOString().slice(0,10)});
      audit("发起成员邀请",name);state.page="members";state.memberTab="invites";state.query="";close();render();toast("邀请已创建，席位已预留（演示）");
    }
    if(a==="confirm-accept"){
      const i=org().invites.find(x=>x.id===id);
      if($("#acceptPhone").value.trim()!==i.phone){toast("手机号与邀请目标不一致");$("#acceptPhone").focus();return}
      if(!$("#acceptConsent").checked){toast("请先阅读并确认机构内容告知");return}
      i.status="已接受";org().members.push({id:"m"+Date.now(),name:i.name,phone:i.phone,email:i.email||"",dept:i.dept||"",role:"Member",status:"正常",joined:new Date().toISOString().slice(0,10),last:"—"});
      audit("受邀用户接受",i.name);close();render();toast("邀请已接受，预留转为正式占用（演示）");return;
    }
    if(a==="reject-invite"){
      const i=org().invites.find(x=>x.id===id);
      if(!confirm(`确认拒绝 ${org().name} 的邀请？`))return;
      i.status="已拒绝";audit("受邀用户拒绝",i.name);close();render();toast("邀请已拒绝，预留席位已释放");return;
    }
  });
  render();
})();
</script>
</body>
</html>
