    const sectionOrder = ["experts","skills","connectors"];

      const home = el("toolHome");
      if(home) home.classList.toggle("selected", selected);

      sections[section].groups.flatMap(group =>
        group.items.map(item => ({...item, section, group:group.name}))
      )
    );
    const findItem = id => allItems().find(item => item.id === id);
    const countSection = key => sections[key].groups.reduce((n,g)=>n+g.items.length,0);

    function icon(id, cls=""){
      return `<svg class="${cls}"><use href="#${id}"/></svg>`;
    }
    function statusInfo(status, section){
      const map = {
        added:{icon:"i-check",class:"status-ok",text:"已添加为 Agent"},
        installed:{icon:"i-check",class:"status-ok",text:"已安装"},
        update:{icon:"i-refresh",class:"status-update",text:"有新版本可更新"},
        connected:{icon:"i-link",class:"status-ok",text:"已连接"},
        pending:{icon:"i-clock",class:"status-pending",text:"待完成配置"},
        warning:{icon:"i-alert",class:"status-warn",text:section==="connectors"?"授权或连接需要处理":"存在需要处理的问题"}
      };
      return map[status] || null;
    }
    function statusMarkup(item){
      const s = statusInfo(item.status,item.section);
      if(!s) return `<span class="status-slot"></span>`;
      return `<span class="status-slot">
        <span class="status-icon ${s.class}" tabindex="0" aria-label="${s.text}">
          ${icon(s.icon)}
          <span class="status-tooltip">${s.text}</span>
        </span>
      </span>`;
    }
    function markText(item){
      if(item.kind==="category") return item.name.slice(0,1);
      if(item.section==="experts") return item.name.slice(0,1);
      if(item.section==="skills") return "S";
      return "C";
    }
    function itemMarkup(item){
      const isCategory = item.kind==="category";
      const selected = isCategory
        ? currentView.kind==="group" && currentView.section===item.section && currentView.group===(item.targetGroup || item.name)
        : currentView.kind==="object" && currentView.id===item.id;
      const attrs = isCategory
        ? `data-panel-category="${item.targetGroup || item.name}" data-section="${item.section}"`
        : `data-item="${item.id}" data-section="${item.section}"`;
      return `<button class="tool-item kind-${item.section.slice(0,-1)}${selected?" selected":""}" ${attrs}>
        <span class="item-mark">${markText(item)}</span>
        <span class="item-copy">
          <span class="item-name">${item.name}</span>
        </span>
        ${isCategory ? '<span class="status-slot"></span>' : `<span class="item-more" role="button" tabindex="0" aria-label="${item.name} 操作" data-item-more="${item.id}" data-section="${item.section}">...</span>`}
      </button>`;
    }
    function headerMarkup(key, active=false){
      const sec = sections[key];
      return `<button class="drawer-header${active?" active":""}" data-drawer="${key}" data-framework-drawer="${key}" aria-expanded="${active}">
        <span class="drawer-symbol">${icon(sec.icon)}</span>
        <span class="drawer-name">${sec.label}</span>
        <span class="drawer-count">${countSection(key)}</span>
        ${icon("i-chevron","drawer-chevron")}
      </button>`;
    }

    function renderAccordion(){
      const shell = el("accordionShell");
      shell.hidden = false;
      if(panelNeutral){
        shell.innerHTML = '<div class="top-headers">' + sectionOrder.map(k => headerMarkup(k,false)).join("") + '</div>';
        shell.querySelectorAll("[data-drawer]").forEach(btn => {
          btn.addEventListener("click", () => openSection(btn.dataset.drawer, true));
        });
        return;
      }
      const activeIndex = sectionOrder.indexOf(activeSection);
      const topKeys = sectionOrder.slice(0,activeIndex);
      const bottomKeys = sectionOrder.slice(activeIndex+1);
      const sec = sections[activeSection];
      const panelItemsBySection = {
        skills:["最近使用","已开启的","官方技能","社区技能"].map(name=>({name,section:"skills",kind:"category",targetGroup:name})),
        connectors:[{name:"已连接",section:"connectors",kind:"category",targetGroup:"已连接"}]
      };
      const panelGroups = panelItemsBySection[activeSection]
        ? [{name:"全部", implicit:true, items:panelItemsBySection[activeSection]}]
        : sec.groups;

      const groups = panelGroups.map(group => `
        <div class="group${group.implicit ? " is-implicit" : ""}">
          <button class="group-title" ${group.implicit ? 'tabindex="-1"' : `data-group="${group.name}" data-section="${activeSection}"`}>
            <span>${group.name}</span><span class="group-line"></span><span class="group-count">${group.items.length}</span>
          </button>
          ${group.items.map(item => itemMarkup({...item,section:activeSection,group:group.name})).join("")}
        </div>
      `).join("");

      shell.innerHTML = `
        <div class="top-headers">${topKeys.map(k=>headerMarkup(k,false)).join("")}</div>
        <div class="active-drawer">
          ${headerMarkup(activeSection,true)}
          <div id="drawerList" class="drawer-list" role="tree">${groups}</div>
        </div>
        <div id="bottomDock" class="bottom-dock">${bottomKeys.map(k=>headerMarkup(k,false)).join("")}</div>
      `;

      shell.querySelectorAll("[data-drawer]").forEach(btn => {
        btn.addEventListener("click",()=>openSection(btn.dataset.drawer,true));
      });
      shell.querySelectorAll("[data-item]").forEach(btn=>{
        btn.addEventListener("click",()=>selectObject(btn.dataset.section,btn.dataset.item));
      });
      shell.querySelectorAll("[data-panel-category]").forEach(btn=>{
        btn.addEventListener("click",()=>selectGroup(btn.dataset.section,btn.dataset.panelCategory));
      });
      shell.querySelectorAll("[data-item-more]").forEach(btn=>{
        btn.addEventListener("click",e=>{
          e.preventDefault();
          e.stopPropagation();
          const item = findItem(btn.dataset.item);
          if(item) showObjectActionMenu(item,btn);
        });
        btn.addEventListener("keydown",e=>{
          if(e.key==="Enter" || e.key===" "){
            e.preventDefault();
            e.stopPropagation();
            const item = findItem(btn.dataset.item);
            if(item) showObjectActionMenu(item,btn);
          }
        });
      });
      shell.querySelectorAll("[data-group]").forEach(btn=>{
        btn.addEventListener("click",()=>selectGroup(btn.dataset.section,btn.dataset.group));
      });

      const list = el("drawerList");
      const dock = el("bottomDock");
      requestAnimationFrame(()=>{
        const dockHeight = bottomKeys.length ? dock.offsetHeight + 10 : 12;
        list.style.setProperty("--dock-space", `${dockHeight}px`);
        list.scrollTop = scrollMemory[activeSection] || 0;
        lastScrollTop = list.scrollTop;
      });

      list.addEventListener("scroll",()=>{
        scrollMemory[activeSection] = list.scrollTop;
        const now = list.scrollTop;
        const delta = now - lastScrollTop;
        if(delta > .5) hideDock();
        if(delta < -2) showDock();
        lastScrollTop = now;
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(showDock,420);
      },{passive:true});

      shell.addEventListener("pointermove",e=>{
        const rect = shell.getBoundingClientRect();
        if(rect.bottom - e.clientY < 82) showDock();
      });
      dock.addEventListener("mouseenter",showDock);
      dock.addEventListener("focusin",showDock);
    }

    function hideDock(){
      const dock = el("bottomDock");
      if(dock && dock.children.length) dock.classList.add("hidden");
    }
    function showDock(){
      const dock = el("bottomDock");
      if(dock) dock.classList.remove("hidden");
    }

    function openSection(key, renderWorkspace=true){
      if(!sections[key]) return;
      activeSection = key;
      panelNeutral = false;
      currentView = renderWorkspace ? {kind:"section",section:key} : currentView;
      el("panelSearch").value = "";
      el("clearSearch").classList.remove("visible");
      setToolHomeSelected(false);
      renderAccordion();
      if(renderWorkspace) renderWorkspaceView();
    }

    function selectGroup(section, group){
      activeSection = section;
      panelNeutral = false;
      currentView = {kind:"group",section,group};
      setToolHomeSelected(false);
      renderAccordion();
      renderWorkspaceView();
    }

    function selectObject(section,id){
      activeSection = section;
      panelNeutral = false;
      currentView = {kind:"object",section,id};
      setToolHomeSelected(false);
      renderAccordion();
      renderWorkspaceView();

      currentView = {kind:"home"};

    function renderSearch(query){
      const q = query.trim().toLowerCase();
      if(!q){
        el("clearSearch").classList.remove("visible");
        renderAccordion();
        return;
      }
      el("clearSearch").classList.add("visible");
      const matches = allItems().filter(item =>
        [item.name,item.subtitle,item.group,sections[item.section].label].join(" ").toLowerCase().includes(q)
      );
      if(!matches.length){
        el("accordionShell").innerHTML = `<div class="empty-search">没有找到“${escapeHtml(query)}”<br><span class="muted">也可以在底部直接问 Alice。</span></div>`;
        return;
      }
      el("accordionShell").innerHTML = sectionOrder.map(section=>{
        const items = matches.filter(x=>x.section===section);
        if(!items.length) return "";
        const byGroup = sections[section].groups.map(group=>{
          const groupItems = items.filter(x=>x.group===group.name);
          if(!groupItems.length) return "";
          return `<div class="group">
            <button class="group-title" data-group="${group.name}" data-section="${section}">
              <span>${group.name}</span><span class="group-line"></span><span class="group-count">${groupItems.length}</span>
            </button>
            ${groupItems.map(item=>itemMarkup(item)).join("")}
          </div>`;
        }).join("");
        return `<div class="active-drawer">
          ${headerMarkup(section,false)}
          <div class="drawer-list" role="tree">${byGroup}</div>
        </div>`;
      }).join("");
      el("accordionShell").querySelectorAll("[data-item]").forEach(btn=>{
        btn.addEventListener("click",()=>{
          el("panelSearch").value="";
          el("clearSearch").classList.remove("visible");
          openSection(btn.dataset.section,false);
          selectObject(btn.dataset.section,btn.dataset.item);
        });
      });
      el("accordionShell").querySelectorAll("[data-group]").forEach(btn=>{
        btn.addEventListener("click",()=>selectGroup(btn.dataset.section,btn.dataset.group));
      });
    }

    function workspaceState(item){

    function bindContentMarketFilters(searchSelector){
      const grid=document.getElementById("connectorPluginGrid");
      const search=document.querySelector(searchSelector);
      if(!grid) return;
      const applyFilters=()=>{
        const active=document.querySelector(".cat-pill.active");
        const cat=active?.dataset.cat || "全部";
        const q=(search?.value || "").trim().toLowerCase();
        grid.querySelectorAll("[data-cat]").forEach(card=>{
          const searchText=(card.dataset.search || card.textContent || "").toLowerCase();
          const matchesCat=cat==="全部" || card.dataset.cat===cat;
          const matchesQuery=!q || searchText.includes(q);
          card.style.display=matchesCat && matchesQuery ? "" : "none";
        });
        grid.querySelectorAll("[data-cat-section]").forEach(section=>{
          const matchesSection=cat==="全部" || section.dataset.catSection===cat;
          const hasVisibleCard=Array.from(section.querySelectorAll("[data-cat]")).some(card=>card.style.display !== "none");
          section.style.display=matchesSection && hasVisibleCard ? "" : "none";
        });

    function skillTags(item,category){
      if(Array.isArray(item.tags) && item.tags.length) return item.tags.slice(0,3);
      const text=[item.subtitle,item.desc,item.name,category].join(" ");
      const tags=[];
      if(/基金|ETF|资产配置|组合|理财/.test(text)) tags.push("基金与配置");
      if(/股票|A股|个股|选股|题材|公司/.test(text)) tags.push("股票研究");

    function updateSkillCardState(id,enabled){
      document.querySelectorAll(`[data-open="${id}"][data-section="skills"]`).forEach(card=>{
        const toggle=card.querySelector(".skill-toggle");
        if(toggle){
          toggle.classList.toggle("on",enabled);
          toggle.setAttribute("aria-checked",enabled ? "true" : "false");
          toggle.setAttribute("aria-label",`${enabled?"停用":"启用"}${card.dataset.title || ""}`);
        }
        card.querySelectorAll("[data-skill-use]").forEach(button=>{
          button.disabled=!enabled;
          button.toggleAttribute("disabled",!enabled);
        });
      });
    }

    function bindSkillMarketControls(officialItems,enabledItems){
      const grid=document.getElementById("skillCardGrid");
      const search=document.querySelector("[data-skill-market-search]");
      const tabs=document.querySelectorAll("[data-skill-tab]");
      if(!grid) return;
      const renderList=(items,enabled=true)=>{
        grid.innerHTML=items.map(item=>skillMarketCard(item,enabled)).join("");
        bindWorkspaceLinks();
      };
      tabs.forEach(tab=>{
        tab.addEventListener("click",()=>{
          tabs.forEach(t=>t.classList.remove("active"));
          tab.classList.add("active");
          if(search) search.value="";
          const key=tab.dataset.skillTab;
          if(key==="enabled") renderList(officialItems,true);
          else if(key==="official") renderList(officialItems,true);
          else if(key==="created") renderList(enabledItems,true);
          else {
            grid.innerHTML=`<div class="skill-empty">社区技能暂未开放<br><span>后续会在这里展示来自社区的技能卡片。</span></div>`;
          }
        });
      });
      if(search){
        search.addEventListener("input",()=>{
          const q=search.value.trim().toLowerCase();
          const filtered=officialItems.filter(item=>[item.name,item.subtitle,item.desc].join(" ").toLowerCase().includes(q));
          renderList(filtered,true);
        });
      }
    }

        if(item.status==="update") primary={label:"更新技能",icon:"i-refresh",action:()=>mutateStatus(item,"installed","技能已更新到 2.5.0")};

        else primary={label:"安装技能",icon:"i-check",action:()=>mutateStatus(item,"installed","技能已安装")};
        secondary={label:"打开到技能",icon:"i-external",action:()=>showToast("将进入技能工作台（演示）")};
      }else if(item.section==="experts"){
      }else{
        if(item.status==="connected") primary={label:"管理连接",icon:"i-link",action:()=>showToast("已打开连接管理（演示）")};
        else if(item.status==="pending"||item.status==="warning") primary={label:"继续配置",icon:"i-clock",action:()=>mutateStatus(item,"connected","连接器配置完成")};

      bindWorkspaceLinks();

    function capabilityCard(iconId,title,desc){
      return `<div class="capability"><span class="capability-icon">${icon(iconId)}</span><strong>${title}</strong></div>`;
    }
    function relationRow(title,sub,status){
      return `<div class="relation-row">
        <span class="mini-avatar">${title.replace("@","").slice(0,2)}</span>
        <span><span class="row-title">${title}</span><span class="row-sub">${sub}</span></span>
        <span class="tag ${status.includes("允许")||status.includes("正常")||status.includes("主能力")?"ok":status.includes("待")||status.includes("需")?"warn":""}">${status}</span>
      </div>`;
    }
    function activityRow(task,actor,time,status){
      return `<div class="activity-row">
        <span><span class="row-title">${task}</span><span class="row-sub">${actor}</span></span>
        <span class="muted">${actor}</span>
        <span class="muted">${time}</span>
        <span class="tag ${status==="成功"||status==="正常"||status==="已完成"?"ok":"warn"}">${status}</span>
      </div>`;
    }

    const connectConfigs={
      "connector-ima":{type:"sso",label:"一键登录",desc:"将跳转到 ima 的扫码登录页面。完成扫码确认后，Alice 会自动接入该知识库能力。",button:"一键登录并扫码"},
      default:{type:"apiKey",label:"API Key",desc:"请输入该连接器的 API Key 或访问凭证。凭证只会隔离保存到个人空间，用于 Alice 调用该连接器。",button:"保存并连接"}
    };
    let currentConnectTarget=null;

    function openConnectModal(item){
      currentConnectTarget=item;
      const detail=connectorDetails[item.id] || {};
      const config=connectConfigs[item.id] || connectConfigs.default;
      const samples=detail.samples || [item.desc];
      document.getElementById("modalTargetLogo").textContent=item.name.slice(0,1);
      document.getElementById("modalTitle").textContent=`连接 ${item.name}`;
      document.getElementById("modalDesc").textContent=config.type==="sso"
        ? "使用 ima 账号一键登录，并在对方页面完成扫码授权。"
        : `填写 ${item.name} 的 API Key 后即可连接到 Alice。`;
      const credentialFields = detail.fields && detail.fields.some(field=>/API|Key|密钥|访问凭证|授权码/.test(field))
        ? detail.fields
        : ["API Key"];
      document.getElementById("connectMethod").innerHTML=config.type==="sso"
        ? `
          <div class="method-label">接入方式 · ${config.label}</div>
          <div class="method-desc">${config.desc}</div>
          <div class="ima-login-card">
            <strong>扫码授权流程</strong>
            <p>点击下方按钮后会打开 ima 登录页，用户在对方页面扫码确认，完成后返回 Alice。</p>
          </div>
        `
        : `
          <div class="method-label">接入方式 · ${config.label}</div>
          <div class="method-desc">${config.desc}</div>
          <form class="connect-form" id="connectCredentialForm">
            ${credentialFields.map(field=>`
              <div class="connect-field">
                <label>${escapeHtml(field)}</label>
                <input type="${/密钥|Key|授权码|访问凭证/.test(field)?"password":"text"}" placeholder="请输入${escapeHtml(field)}" autocomplete="off">
              </div>
            `).join("")}
          </form>
        `;
      document.getElementById("connectBtn").textContent=config.button;
      document.getElementById("modalSampleList").innerHTML=samples.map(s=>`
        <div class="sample-item" data-prompt="${s}">
          <div class="sample-icon">→</div>
          <span>@${item.name} ${s}</span>
        </div>
      `).join("");
      document.getElementById("connectOverlay").classList.add("show");
      bindConnectModalEvents();
    }

    function closeConnectModal(){
      document.getElementById("connectOverlay").classList.remove("show");
      currentConnectTarget=null;
    }

    function bindConnectModalEvents(){
      document.getElementById("closeConnectModal").onclick=closeConnectModal;
      document.getElementById("connectOverlay").onclick=e=>{if(e.target.id==="connectOverlay") closeConnectModal();};
      document.getElementById("connectBtn").onclick=()=>{
        if(currentConnectTarget){
          if(currentConnectTarget.id==="connector-ima"){
            showToast("已跳转到 ima 扫码登录页面（演示）");
            window.open("https://ima.qq.com/", "_blank");
          }else{
            mutateStatus(currentConnectTarget,"connected",`${currentConnectTarget.name} 已连接`);
          }
          closeConnectModal();
        }
      };
      document.querySelectorAll("#modalSampleList .sample-item").forEach(item=>{
        item.onclick=()=>{
          const prompt=item.dataset.prompt || "";
          prefillAi(prompt,false);
          closeConnectModal();
        };
      });
    }

    function mutateStatus(item,newStatus,message){
      const src=sections[item.section].groups.flatMap(g=>g.items).find(x=>x.id===item.id);
      src.status=newStatus;
      showToast(message+"（演示）");
      renderAccordion();
      renderWorkspaceView();
    }

    function findSourceItem(item){
      return sections[item.section]?.groups.flatMap(g=>g.items).find(x=>x.id===item.id);
    }

    function objectActions(item){
      if(item.section==="connectors"){
        const src=findSourceItem(item) || item;
        const isConnected=src.status==="connected" || src.status==="warning" || src.enabled===false;
        const isEnabled=src.enabled !== false && src.status==="connected";
        if(!isConnected) return [{label:"连接服务",action:"connect"}];
        return [
          {label:isEnabled ? "停用" : "启用",action:isEnabled ? "disable" : "enable"},
          {label:"解除授权",action:"revoke"}
        ];
      }
      if(item.section==="chat") return [{label:"删除聊天",action:"delete-chat"}];
      if(item.section==="work" || item.section==="projects") return [{label:"删除项目",action:"delete-project"}];
      return [{label:"移除",action:"remove"}];
    }

    function closeObjectActionMenu(){
      document.querySelectorAll(".object-action-menu").forEach(menu=>menu.remove());
    }

    function showObjectActionMenu(item,anchor){
      closeObjectActionMenu();
      const rect=anchor.getBoundingClientRect();
      const menu=document.createElement("div");
      menu.className="object-action-menu";
      menu.style.left=Math.max(8,rect.right-132)+"px";
      menu.style.top=Math.min(window.innerHeight-12,rect.bottom+6)+"px";
      menu.innerHTML=objectActions(item).map(action=>`<button type="button" data-object-action="${action.action}" data-object-id="${item.id}" data-object-section="${item.section}">${action.label}</button>`).join("");
      document.body.appendChild(menu);
      menu.querySelectorAll("[data-object-action]").forEach(btn=>{
        btn.addEventListener("click",e=>{
          e.stopPropagation();
          handleObjectAction(item,btn.dataset.objectAction);
          closeObjectActionMenu();
        });
      });
      setTimeout(()=>{
        document.addEventListener("click",closeObjectActionMenu,{once:true});
      },0);
    }

    function handleObjectAction(item,action){
      const src=findSourceItem(item);
      if(!src) return;
      if(action==="connect"){
        src.status="connected";
        src.enabled=true;
        showToast(`${src.name} 已连接（演示）`);
      }else if(action==="disable"){
        src.enabled=false;
        showToast(`${src.name} 已停用（演示）`);
      }else if(action==="enable"){
        src.status="connected";
        src.enabled=true;
        showToast(`${src.name} 已启用（演示）`);
      }else if(action==="revoke"){
        src.status=null;
        src.enabled=false;
        showToast(`${src.name} 已解除授权（演示）`);
      }else if(action==="delete-chat"){
        showToast("聊天已删除（演示）");
      }else if(action==="delete-project"){
        showToast("项目已删除（演示）");
      }else{
        showToast("对象已移除（演示）");
      }
      renderAccordion();
      renderWorkspaceView();
    }

    function promptIconId(text){
      if(/权限|风险|授权|合规/.test(text)) return "i-shield";
      if(/Agent|专家|分配|使用它/.test(text)) return "i-users";
      if(/连接|配置/.test(text)) return "i-link";
      if(/测试|试用|运行/.test(text)) return "i-play";
      if(/找|推荐|比较|打开|哪些/.test(text)) return "i-search";
      if(/财报|文件|公告/.test(text)) return "i-file";
      if(/数据|调用/.test(text)) return "i-database";
      return "i-sparkle";
    }

    function renderComposer(){
      let context="我的工具";
      let examples=["找一个能分析上市公司财报的技能","打开授权即将过期的连接器"];
      if(currentView.kind==="section"){
        context=sections[currentView.section].label+"广场";
        examples=currentView.section==="skills"
          ?["哪些技能最近没有被使用？","找出权限风险最高的技能"]
          :currentView.section==="connectors"
            ?["哪些连接器需要重新授权？","找出调用失败最多的连接器"]
            :["哪些专家缺少关键能力？","推荐适合港股研究的专家"];
      }else if(currentView.kind==="group"){
        context=currentView.group;
        examples=[`比较“${currentView.group}”中的对象`,`推荐最适合当前任务的一个`];
      }else if(currentView.kind==="object"){
        const item=findItem(currentView.id);
        context=item.name;
        if(item.section==="skills") examples=["测试这个技能","分配给 @A18","检查权限风险"];
        if(item.section==="experts") examples=["用一个真实问题试用","比较相近专家","添加为 Agent"];
        if(item.section==="connectors") examples=["测试连接","查看使用它的 Agent","解释需要的权限"];
      }
      el("composerFooter").innerHTML=`
        <span class="context-chip">${icon("i-sparkle")}<span>上下文：${context}</span></span>
        ${examples.map(x=>`<button class="quick-chip" data-prompt="${x}">${icon(promptIconId(x))}<span>${x}</span></button>`).join("")}
      `;
      document.querySelectorAll("#composerFooter [data-prompt]").forEach(b=>b.addEventListener("click",()=>prefillAi(b.dataset.prompt,true)));
      el("aiInput").placeholder=`问 Alice、修改“${context}”，或交代一项任务……`;
    }

    function prefillAi(text,send=false){
      document.body.classList.add("dialog-draft-open");
      el("aiInput").value=text;
      el("aiInput").focus();
      showToast("已填入对话框（演示）");
      if(send) handleAiSend();
    }
    function handleAiSend(){
      const input=el("aiInput");
      const value=input.value.trim();
      if(!value) return;
      input.value="";
      const item=currentView.kind==="object"?findItem(currentView.id):null;
      let title="Alice 已理解当前上下文";
      let body=`我会基于“${currentContextName()}”处理：${value}`;
      let confirmLabel="执行";
      let onConfirm=()=>showToast("已按当前上下文执行（演示）");

      if(item && item.section==="skills" && /安装|更新/.test(value)){
        title=`准备${item.status==="update"?"更新":"安装"} ${item.name}`;
        body=`将修改技能状态，并保留当前 Agent 分配关系。此操作可撤销。`;
        confirmLabel=item.status==="update"?"确认更新":"确认安装";
        onConfirm=()=>mutateStatus(item,"installed",`${item.name} 已完成${item.status==="update"?"更新":"安装"}`);
      }else if(item && item.section==="experts" && /添加|Agent/.test(value)){
        title=`准备将 ${item.name} 添加为 Agent`;
        body=`将创建一个可在 Agents 中继续编辑的实例，不会自动启用高风险权限。`;
        confirmLabel="确认添加";
        onConfirm=()=>mutateStatus(item,"added",`${item.name} 已添加为 Agent`);
      }else if(item && item.section==="connectors" && /连接|配置|授权/.test(value)){
        title=`准备处理 ${item.name} 的连接`;
        body=`将进入授权或配置流程；读取与执行权限会分别展示。`;
        confirmLabel="继续";
        onConfirm=()=>mutateStatus(item,"connected",`${item.name} 已连接`);
      }else if(/找|推荐|打开/.test(value)){
        title="Alice 找到了最相关的对象";
        const target=/公告/.test(value)?"connector-wechat-public":/财报|财务/.test(value)?"skill-global-earnings-review":/量化|个股/.test(value)?"expert-stock-research":"skill-deep-research";
        const t=findItem(target);
        body=`建议打开“${t.name}”。我可以自动展开 ${sections[t.section].label} 抽屉并定位到它。`;
        confirmLabel="打开对象";
        onConfirm=()=>selectObject(t.section,t.id);
      }
      showProposal(title,body,confirmLabel,onConfirm);
    }
    function showProposal(title,body,confirmLabel,onConfirm){
      const p=el("aiProposal");
      p.innerHTML=`
        <div class="ai-proposal-icon">${icon("i-sparkle")}</div>
        <div><div class="proposal-title">${title}</div><div class="proposal-text">${body}</div></div>
        <div class="proposal-actions">
          <button id="proposalCancel" class="btn ghost">取消</button>
          <button id="proposalConfirm" class="btn primary">${confirmLabel}</button>
        </div>
      `;
      p.classList.add("visible");
      el("proposalCancel").addEventListener("click",()=>p.classList.remove("visible"));
      el("proposalConfirm").addEventListener("click",()=>{
        p.classList.remove("visible");
        onConfirm();
      });
    }
    function currentContextName(){
      if(currentView.kind==="home") return "我的工具";
      if(currentView.kind==="section") return sections[currentView.section].label;
      if(currentView.kind==="group") return currentView.group;
      return findItem(currentView.id).name;
    }
    function showToast(message){
      const t=el("toast");
      t.textContent=message;
      t.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>t.classList.remove("visible"),2600);
    }
    function escapeHtml(s){
      return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
    }

    el("panelSearch").addEventListener("input",e=>renderSearch(e.target.value));
    el("clearSearch").addEventListener("click",e=>{
      e.preventDefault();
      el("panelSearch").value="";
      renderSearch("");
      el("panelSearch").focus();
    });
    if(el("toolHome")) el("toolHome").addEventListener("click",selectHome);
    el("sendAi").addEventListener("click",handleAiSend);
    el("aiInput").addEventListener("keydown",e=>{
      if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleAiSend()}
    });
    document.querySelectorAll(".nav-item").forEach(btn=>{
      btn.addEventListener("click",()=>{
        if(btn.dataset.nav!=="工具市场") showToast(`${btn.dataset.nav} 模块在此 Demo 中保持原产品不变`);
      });
    });

    renderAccordion();
    renderWorkspaceView();
  </script>






















































<script id="xai-real-dom-marquee-script-v9">
(() => {
  const ROOT_ID = "workspaceContent";

  function makeLayer(grid, kind){
    if(grid.querySelector(":scope > .xai-real-marquee")) return;

    const layer = document.createElement("div");
    layer.className = "xai-real-marquee";
    layer.setAttribute("aria-hidden","true");

    if(kind === "detail"){
      layer.style.setProperty("--marquee-top", "var(--xai-band-top,32px)");
      layer.style.setProperty("--marquee-bottom", "var(--xai-band-bottom,128px)");
      layer.style.setProperty("--marquee-cell", "var(--xai-cell,96px)");
    }else{
      layer.style.setProperty("--marquee-top", "calc(50% - 48px)");
      layer.style.setProperty("--marquee-bottom", "calc(50% + 48px)");
      layer.style.setProperty("--marquee-cell", "var(--xai-overview-cell,64px)");
    }

    const top = document.createElement("span");
    top.className = "xai-h-sweep xai-h-top";

    const bottom = document.createElement("span");
    bottom.className = "xai-h-sweep xai-h-bottom";

    const vertical = document.createElement("span");
    vertical.className = "xai-v-sweep";

    layer.append(top, bottom, vertical);
    grid.appendChild(layer);
  }

  function enhance(){
    const root = document.getElementById(ROOT_ID);
    if(!root) return;
    root.querySelectorAll(".xai-detail-grid").forEach(grid => makeLayer(grid, "detail"));
    root.querySelectorAll(".xai-stat-grid").forEach(grid => makeLayer(grid, "overview"));
  }

  enhance();

  const root = document.getElementById(ROOT_ID);
  if(!root) return;

  const observer = new MutationObserver(() => {
    requestAnimationFrame(enhance);
  });
  observer.observe(root, {childList:true, subtree:true});
})();
</script>

<script id="panel-framework-controls-v1">
(function(){
  function init(){
    const fold=document.getElementById('panelFoldToggle');
    const search=document.getElementById('panelSearchToggle');

      ]

  };

  const navOrder = ["首页","Chat","Work","Link","会议","定时与提醒","文件夹","工具市场"];
  const drawerState = {};
  let currentNav = "工具市场";

  function icon(id, cls){
    return '<svg class="'+(cls||'')+'"><use href="#'+id+'"/></svg>';
  }
  function itemMarkup(navName, drawer, group, item, index){
    const itemName = typeof item === "string" ? item : item.name;
    const marketAttrs = item && item.section && item.id
      ? ' data-market-section="'+item.section+'" data-market-id="'+item.id+'"'
      : (item && item.section && item.group ? ' data-market-section="'+item.section+'" data-market-group="'+item.group+'"' : '');
    const id = [navName, drawer.label, group.name, itemName, index].join("-");
    // 对象：分类下的具体条目
    return '<button class="tool-item" type="button" data-arch-item="'+id+'"'+marketAttrs+'>'+
      '<span class="item-mark">'+itemName.slice(0,1)+'</span>'+
      '<span class="item-copy"><span class="item-name">'+itemName+'</span></span>'+
      '<span class="status-slot"></span>'+
    '</button>';
  }
  function countDrawer(drawer){
    return drawer.groups.reduce((sum, group) => sum + group.items.length, 0);
  }
  function drawerHeader(drawer, active, idx){
    // 抽屉：panel 中的一级内容容器标题
    return '<button class="drawer-header'+(active?' active':'')+'" type="button" data-arch-drawer="'+idx+'" aria-expanded="'+active+'">'+
      '<span class="drawer-symbol">'+icon(drawer.icon)+'</span>'+
      '<span class="drawer-name">'+drawer.label+'</span>'+
      '<span class="drawer-count">'+countDrawer(drawer)+'</span>'+
      icon("i-chevron","drawer-chevron")+
    '</button>';
  }
  function renderNav(){
    const navList = document.querySelector('.global-nav .nav-list');
    if(!navList) return;
    navList.innerHTML = navOrder.map(name => {
      const data = architecture[name];
      const labelMap = {Chat:"Chat",Work:"Work",Link:"拓客服务",会议:"会议",定时与提醒:"自动任务",文件夹:"文件资料",工具市场:"工具市场"};
      const label = labelMap[name] || name;
      return '<button class="nav-item'+(name===currentNav?' active':'')+'" data-nav="'+name+'" type="button">'+
        '<svg class="nav-icon"><use href="#'+data.icon+'"/></svg><span class="nav-label">'+label+'</span>'+
      '</button>';
    }).join("");
    navList.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        currentNav = btn.dataset.nav;
        renderNav();
        renderPanel();
        if(typeof showToast === 'function') showToast(currentNav + ' Panel 已切换（演示）');
      });
    });
    const profile = document.querySelector('.global-nav .profile');
    if(profile) profile.classList.toggle('active', currentNav === '个人中心');
  }
  function renderPanel(query){
    const panel = document.querySelector('.panel');
    const shell = document.getElementById('accordionShell');
    const search = document.getElementById('panelSearch');
    const create = document.getElementById('panelCreate');
    if(!panel || !shell) return;
    panel.dataset.architecturePanel = "true";
    const data = architecture[currentNav];
    if(create){
      const span = create.querySelector('span');
      if(span) span.textContent = data.create;
    }
    if(search) {
      search.placeholder = data.search;
      if(query === undefined) search.value = "";
    }
    shell.hidden = false;
    const filterText = (query || "").trim().toLowerCase();
    const activeIndex = Math.min(drawerState[currentNav] || 0, data.drawers.length - 1);
    drawerState[currentNav] = activeIndex;
    const top = data.drawers.slice(0, activeIndex);
    const active = data.drawers[activeIndex];
    const bottom = data.drawers.slice(activeIndex + 1);
    const marketSectionByDrawer = {专家:"experts",技能:"skills",连接器:"connectors"};
    const groups = active.groups.map(group => {
      const items = filterText
        ? group.items.filter(item => [(typeof item === "string" ? item : item.name), group.name, active.label].join(" ").toLowerCase().includes(filterText))
        : group.items;
      if(!items.length) return "";
      const groupAttrs = currentNav === "工具市场" && marketSectionByDrawer[active.label] ? ' data-market-group-section="'+marketSectionByDrawer[active.label]+'" data-market-group="'+group.name+'"' : '';
      // 分类：抽屉展开后，对象列表上方的分组名称
      return '<div class="group'+(group.implicit?' is-implicit':'')+'">'+
        '<button class="group-title" type="button" tabindex="-1"'+groupAttrs+'><span>'+group.name+'</span><span class="group-line"></span><span class="group-count">'+items.length+'</span></button>'+
        items.map((item, idx) => itemMarkup(currentNav, active, group, item, idx)).join("")+
      '</div>';
    }).join("");
    const listContent = groups || '<div class="empty-search">没有找到匹配对象<br><span class="muted">也可以在底部直接问 Alice。</span></div>';
    shell.innerHTML =
      '<div class="top-headers">'+top.map((drawer, idx) => drawerHeader(drawer, false, idx)).join("")+'</div>'+
      '<div class="active-drawer">'+drawerHeader(active, true, activeIndex)+'<div id="drawerList" class="drawer-list" role="tree">'+listContent+'</div></div>'+
      '<div id="bottomDock" class="bottom-dock">'+bottom.map((drawer, offset) => drawerHeader(drawer, false, activeIndex + 1 + offset)).join("")+'</div>';
    shell.querySelectorAll('[data-arch-drawer]').forEach(btn => {
      btn.addEventListener('click', () => {
        drawerState[currentNav] = Number(btn.dataset.archDrawer);
        renderPanel();
        if(currentNav === "工具市场"){
          const target = marketSectionByDrawer[data.drawers[drawerState[currentNav]].label];
          if(target && typeof openSection === "function") openSection(target, true);
        }
      });
    });
    shell.querySelectorAll('[data-market-group]').forEach(btn => {
      btn.addEventListener('click', () => {
        if(typeof selectGroup === "function") selectGroup(btn.dataset.marketGroupSection, btn.dataset.marketGroup);
      });
    });
    shell.querySelectorAll('[data-arch-item]').forEach(btn => {
      btn.addEventListener('click', () => {
        if(btn.dataset.marketGroup && typeof selectGroup === "function"){
          selectGroup(btn.dataset.marketSection, btn.dataset.marketGroup);
          return;
        }
        if(btn.dataset.marketId && typeof selectObject === "function"){
          selectObject(btn.dataset.marketSection, btn.dataset.marketId);
          return;
        }
        shell.querySelectorAll('.tool-item.selected').forEach(x => x.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
    const list = document.getElementById('drawerList');
    const dock = document.getElementById('bottomDock');
    requestAnimationFrame(() => {
      if(list && dock){
        const dockHeight = bottom.length ? dock.offsetHeight + 10 : 12;
        list.style.setProperty('--dock-space', dockHeight + 'px');
      }
    });
  }
  function init(){
    const profile = document.querySelector('.global-nav .profile');
    if(profile){
      profile.setAttribute('role','button');
      profile.setAttribute('tabindex','0');
      profile.setAttribute('aria-label','个人中心');
      profile.addEventListener('click', () => {
        var popover=document.getElementById('profilePopover');
        if(!popover) return;
        var open=!popover.classList.contains('visible');
        popover.classList.toggle('visible',open);
        popover.setAttribute('aria-hidden',String(!open));
        profile.setAttribute('aria-expanded',String(open));
        profile.classList.toggle('menu-open',open);
      });
      profile.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          profile.click();
        }
      });
    }
    const search = document.getElementById('panelSearch');
    const clear = document.getElementById('clearSearch');
    if(search){
      search.addEventListener('input', e => {
        e.stopImmediatePropagation();
        clear?.classList.toggle('visible', !!e.target.value.trim());
        renderPanel(e.target.value);
      }, true);
    }
    if(clear){
      clear.addEventListener('click', e => {
        e.preventDefault();
        e.stopImmediatePropagation();
        search.value = '';
        clear.classList.remove('visible');
        renderPanel('');
        search.focus();
      }, true);
    }
  }
  window.renderArchitecturePanel=renderPanel;
})();
</script>

<script id="profile-popover-bridge">
(function(){
  var popover=document.getElementById("profilePopover");
  if(!popover) return;
  var profileBtn=document.querySelector(".global-nav .profile");
  if(!profileBtn) return;
  popover.addEventListener("click",function(e){
    e.stopPropagation();
    var target=e.target.closest("[data-toast]");
    if(target){
      if(typeof showToast==="function"){ showToast(target.getAttribute("data-toast")); }
      setPopover(false);
    }
  });
  var settingsBtn=document.getElementById("profileSettingsBtn");
  if(settingsBtn){
    settingsBtn.addEventListener("click",function(){
      setPopover(false);
      window.location.href="../Alice_User/index.html";
    });
  }
  var rechargeBtn=document.getElementById("profileRechargeBtn");
  if(rechargeBtn){
    rechargeBtn.addEventListener("click",function(){
      setPopover(false);
      window.location.href="../Alice_User/index.html?view=recharge";
    });
  }
  document.addEventListener("click",function(e){
    if(!popover.contains(e.target) && !profileBtn.contains(e.target)){
      setPopover(false);
    }
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape") setPopover(false);
  });
  function setPopover(open){
    popover.classList.toggle("visible",open);
    popover.setAttribute("aria-hidden",String(!open));
    profileBtn.setAttribute("aria-expanded",String(open));
    profileBtn.classList.toggle("menu-open",open);
  }
  window.__setProfilePopover=setPopover;
})();
</script>

    document.getElementById("aliceBridgeNotifications")?.classList.add("alice-bridge-hidden");
    document.getElementById("aliceBridgeProfilePopover")?.classList.add("alice-bridge-hidden");
    document.querySelectorAll(".alice-bridge-rail-button,.alice-bridge-mini").forEach(function(el){el.classList.remove("is-open")});
  });
})();

</script>
</body>
